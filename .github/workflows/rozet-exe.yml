# Rozet Tarayıcı .exe'sini (Electron masaüstü uygulaması) GitHub'ın Windows
# sunucusunda derler. Bu dosya push edilince (ya da elle "Run workflow") çalışır.
# exe'yi Releases'tan tek tıkla indirebilirsin - bilgisayarına Node kurmana gerek yok.
name: rozet-exe-derle
on:
  push:
    paths:
      - 'rozet-tarayici/**'
      - '.github/workflows/rozet-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rozet-tarayici
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          # electron-builder yayınlama yapmasın, sadece derlesin.
          GH_TOKEN: ${{ github.token }}
      # 1) Actions artifact (bilgisayardan + girişliyken)
      - uses: actions/upload-artifact@v4
        with:
          name: RozetTarayici-exe
          path: rozet-tarayici/dist/RozetTarayici.exe
          if-no-files-found: error
      # 2) Releases sürümü olarak da yayınla -> tek tıkla direkt indirme linki
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rozet-exe
          name: Rozet Tarayıcı (exe)
          body: "Çift tıkla çalışır; kendi penceresinde (tarayıcı değil) açılır. Token gir + davet linki gir + Tara. ⚠️ Kullanıcı hesabı taraması ToS ihlali, ana hesabını kullanma."
          files: rozet-tarayici/dist/RozetTarayici.exe
